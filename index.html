<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prueba cámara PWA</title><script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><style>body{font:16px sans-serif;margin:16px}video{width:100%;background:#000}#log{white-space:pre-wrap;font:13px monospace;background:#eee;padding:8px}</style></head>
<body>
<h3>Cámara en página propia (GitHub Pages)</h3>
<button id="api">0 · Llamar a la API (GET + POST)</button>
<button id="live">1 · Cámara en vivo</button>
<label style="display:block;margin:12px 0">2 · Botón de archivo: <input id="file" type="file" accept="image/*" capture="environment"></label>
<video id="v" playsinline muted></video>
<div id="log"></div>
<script>
const log = m => document.getElementById('log').textContent += m + '\n';
log('BarcodeDetector: ' + ('BarcodeDetector' in window));
log('getUserMedia: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
const API = 'https://script.google.com/macros/s/AKfycbwHfUHw-mcISwAhZDkDl1t5oDaMmxERnLVefQpZ1LK052mXSQxv23kha5adQvde_0bE/exec';
document.getElementById('api').onclick = async () => {
  log('origen de esta página: ' + location.origin);
  try { let t = performance.now(); const g = await (await fetch(API + '?code=7441001234567')).json(); log('API GET: OK ' + Math.round(performance.now() - t) + ' ms → ' + g.code); }
  catch (e) { log('API GET: FALLA → ' + e); }
  try { let t = performance.now(); const p = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ code: '7441001234567', user: 'prueba' }) })).json(); log('API POST: OK ' + Math.round(performance.now() - t) + ' ms → ' + JSON.stringify(p.received)); }
  catch (e) { log('API POST: FALLA → ' + e); }
};
document.getElementById('live').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.getElementById('v'); v.srcObject = s; await v.play();
    log('CÁMARA EN VIVO: OK');
    if (!('BarcodeDetector' in window)) return;
    const d = new BarcodeDetector({ formats: ['ean_13', 'upc_a', 'ean_8'] });
    const t0 = Date.now();
    const tick = async () => {
      const r = await d.detect(v).catch(e => (log('detect: ' + e), []));
      if (r.length) { log('CÓDIGO: ' + r[0].rawValue + ' (' + r[0].format + ')'); s.getTracks().forEach(x => x.stop()); return; }
      if (Date.now() - t0 < 30000) requestAnimationFrame(tick); else log('30 s sin código');
    };
    tick();
  } catch (e) { log('CÁMARA EN VIVO: FALLA → ' + e.name + ': ' + e.message); }
};
document.getElementById('file').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  log('ARCHIVO: OK (' + f.type + ', ' + Math.round(f.size / 1024) + ' KB)');
  if ('BarcodeDetector' in window) {
    const r = await new BarcodeDetector({ formats: ['ean_13', 'upc_a', 'ean_8'] }).detect(await createImageBitmap(f)).catch(e => (log('detect: ' + e), []));
    log(r.length ? 'CÓDIGO EN FOTO (BarcodeDetector): ' + r[0].rawValue : 'BarcodeDetector: foto sin código legible');
  }
  try { const res = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(URL.createObjectURL(f)); log('CÓDIGO EN FOTO (ZXing): ' + res.getText()); }
  catch (e) { log('ZXing: ' + (window.ZXing ? 'sin código legible' : 'librería no cargó')); }
};
</script></body></html>
